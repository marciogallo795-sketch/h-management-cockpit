<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H! Management Cockpit</title>
<style>
:root{
  --bg:#f4f6f3;--panel:#fff;--text:#15201d;--muted:#6f7b77;--line:#dfe6e2;
  --green:#00695f;--green2:#0f897c;--lime:#b5d94e;--red:#c65353;--orange:#dd8b47;
  --shadow:0 12px 30px rgba(16,34,30,.07);--radius:20px
}
*{box-sizing:border-box}html,body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:#12211f;color:#fff;padding:22px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo{width:48px;height:48px;border-radius:14px;background:var(--lime);color:#12211f;font-weight:900;font-size:24px;display:grid;place-items:center}
.brand strong{display:block}.brand span{font-size:11px;color:#aab8b4;display:block;margin-top:4px}
.nav{display:grid;gap:7px;margin-top:22px}.nav button{border:0;background:transparent;color:#c6d1ce;text-align:left;padding:12px;border-radius:11px;font-weight:700}
.nav button.active,.nav button:hover{background:rgba(181,217,78,.12);color:#fff}.nav button.active{box-shadow:inset 3px 0 0 var(--lime)}
.sidebar-foot{margin-top:auto;display:grid;gap:8px}
.btn{border-radius:11px;padding:10px 13px;font-weight:750;border:1px solid transparent}.primary{background:var(--green);color:white}.primary:hover{background:var(--green2)}
.secondary{background:white;color:var(--text);border-color:var(--line)}.ghost{background:transparent;color:#bdc7c4;border-color:rgba(255,255,255,.16)}
.filelabel{display:block;text-align:center}.filelabel input{display:none}
.main{padding:28px 32px 48px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:24px}
.eyebrow{font-size:11px;letter-spacing:.11em;color:var(--green);font-weight:800;margin:0 0 6px}.top h1{margin:0;font-size:30px}.top p{margin:6px 0 0;color:var(--muted)}
.panel,.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel{padding:19px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:15px}.kpi{padding:17px}
.klabel{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}.kvalue{font-size:26px;font-weight:850;margin-top:8px}.kfoot{font-size:12px;color:var(--muted);margin-top:5px}
.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}.section-head h3{margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.stages{display:grid;grid-template-columns:repeat(8,minmax(105px,1fr));gap:8px;overflow:auto}.stage{background:#fbfcfb;border:1px solid var(--line);border-radius:14px;padding:12px}.stage b{font-size:11px;color:var(--green)}.stage strong{display:block;margin-top:4px}.stage small{display:block;color:var(--muted);margin-top:8px;line-height:1.4}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-top:15px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:15px}table{width:100%;border-collapse:collapse;min-width:980px;background:#fff}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:#f9faf8;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.badge{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.green{background:#e8f5f1;color:#0c6b61}.orange{background:#fff0e3;color:#985924}.red{background:#fdeaea;color:#a43c3c}.gray{background:#eef1f0;color:#5d6864}.blue{background:#eaf1f8;color:#46627b}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters input,.filters select,.form-grid input,.form-grid select,.form-grid textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.actions{display:flex;gap:6px;flex-wrap:wrap}.mini{padding:6px 8px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:11px;font-weight:700}.danger{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:25px}.alert{border-left:4px solid var(--orange);background:#fff7ef;border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:8px}.alert.red{border-color:var(--red);background:#fff0f0}
.card{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px}.card h4{margin:0}.card p{font-size:12px;color:var(--muted);margin:6px 0 0}.progress{height:7px;background:#edf0ef;border-radius:99px;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:var(--green)}
.cashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.cashcard{border:1px solid var(--line);border-radius:14px;padding:13px}.cashcard h4{margin:0 0 9px}.cashcard dl{display:grid;grid-template-columns:1fr auto;gap:6px 8px;font-size:12px;margin:0}.cashcard dt{color:var(--muted)}.cashcard dd{margin:0;font-weight:700}
.meeting{display:grid;gap:11px}.mstep{display:grid;grid-template-columns:42px 1fr;gap:10px}.mnum{width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}.mstep h4{margin:1px 0 2px}.mstep p{margin:0;color:var(--muted);font-size:12px}
.modalbg{position:fixed;inset:0;background:rgba(8,18,16,.48);display:grid;place-items:center;padding:18px;z-index:30}.hidden{display:none}.modal{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:21px}.modalhead{display:flex;justify-content:space-between;gap:12px}.modalhead h2{margin:0}.close{border:0;background:#f1f4f2;border-radius:9px;width:38px;height:38px;font-size:22px}
.journey{display:flex;gap:6px;align-items:center;overflow:auto;padding:10px 0}.jpill{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 9px;font-size:11px;font-weight:800;color:var(--muted)}.jpill.done{background:#eaf5f1;color:var(--green)}.jpill.current{background:var(--green);color:#fff}
.form-section{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.form-section:first-child{border-top:0;padding-top:0;margin-top:0}.form-section h3{margin:0 0 4px}.form-section p{margin:0 0 11px;color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.field textarea{min-height:78px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:15px;margin-top:17px}
@media(max-width:1000px){.shell{grid-template-columns:210px 1fr}.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:720px){.shell{display:block}.sidebar{position:relative;height:auto}.nav{grid-template-columns:repeat(2,1fr)}.main{padding:18px 12px}.top{flex-direction:column;align-items:flex-start}.kpis{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="logo">H!</div><div><strong>Management Cockpit</strong><span>Commercial • Delivery • Growth • Cash</span></div></div>
    <nav id="nav" class="nav">
      <button class="active" data-view="dashboard">Cockpit</button>
      <button data-view="journey">Oportunidades & Projetos</button>
      <button data-view="cash">Caixa</button>
      <button data-view="meeting">Modo Reunião</button>
    </nav>
    <div class="sidebar-foot">
      <button id="exportBtn" class="btn secondary">Exportar backup</button>
      <label class="btn secondary filelabel">Importar backup<input id="importInput" type="file" accept=".json"></label>
      <button id="resetBtn" class="btn ghost">Limpar dados</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div><p class="eyebrow">H! CONSULTORIA</p><h1 id="viewTitle">Cockpit</h1><p id="viewSubtitle">Visão executiva da jornada completa, do Radar à Expansão.</p></div>
      <button id="primaryAction" class="btn primary">+ Nova oportunidade</button>
    </header>
    <section id="content"></section>
  </main>
</div>

<div id="modalbg" class="modalbg hidden">
  <div class="modal">
    <div class="modalhead"><div><p class="eyebrow">REGISTRO H!</p><h2 id="modalTitle">Nova oportunidade</h2></div><button id="closeBtn" class="close">×</button></div>
    <form id="form"><div id="formBody"></div><div class="modal-actions"><button type="button" id="cancelBtn" class="btn secondary">Cancelar</button><button type="submit" class="btn primary">Salvar</button></div></form>
  </div>
</div>

<script>
const CFG={stages:[["S0","Radar"],["S1","Qualificada"],["S2","Discovery"],["S3","Proposta"],["S4","Commit"],["S5","Backlog"],["S6","Delivery"],["S7","Expand"]],statuses:["Ativa","Em espera","Perdida","Encerrada"]};
const KEY="h_management_cockpit_v3";
let state={records:[],cash:[],actions:[]}, view="dashboard", editing={type:null,id:null};
try{const s=localStorage.getItem(KEY);if(s)state={...state,...JSON.parse(s)}}catch(e){}
const $=s=>document.querySelector(s);
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const money=v=>num(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const dateBR=v=>{if(!v)return"—";const a=v.split("-");return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:v};
const stageIdx=s=>Math.max(0,CFG.stages.findIndex(x=>x[0]===s));
const stageLabel=s=>{const x=CFG.stages.find(a=>a[0]===s);return x?`${x[0]} • ${x[1]}`:"—"};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const contrib=r=>num(r.revenue)-num(r.consultantCost)-num(r.taxes);
const weighted=r=>num(r.opportunityValue)*(num(r.probability)/100);
function badge(v){const c=v==="Ativa"?"green":v==="Em espera"?"orange":v==="Perdida"?"red":v==="Encerrada"?"blue":"gray";return `<span class="badge ${c}">${v||"Sem status"}</span>`}
function healthBadge(v){const c=v==="Verde"?"green":v==="Amarelo"?"orange":v==="Vermelho"?"red":"gray";return `<span class="badge ${c}">${v||"Sem status"}</span>`}
function setView(v){view=v;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));const t={dashboard:["Cockpit","Visão executiva da jornada completa, do Radar à Expansão."],journey:["Oportunidades & Projetos","Um único registro percorre S0 → S7. A etapa define os campos da fase."],cash:["Caixa","Planejamento financeiro totalmente aberto."],meeting:["Modo Reunião","Roteiro executivo para a reunião interna da H!."]}[v];$("#viewTitle").textContent=t[0];$("#viewSubtitle").textContent=t[1];$("#primaryAction").textContent=v==="cash"?"+ Novo período":v==="meeting"?"+ Nova ação":"+ Nova oportunidade";render()}
function render(){if(view==="dashboard")dashboard();if(view==="journey")journeyView();if(view==="cash")cashView();if(view==="meeting")meetingView()}
function kpi(a,b,c){return `<div class="kpi"><div class="klabel">${a}</div><div class="kvalue">${b}</div><div class="kfoot">${c}</div></div>`}
function dashboard(){
 const active=state.records.filter(r=>["Ativa","Em espera"].includes(r.status||"Ativa")),commercial=active.filter(r=>stageIdx(r.stage)<=4),backlog=active.filter(r=>r.stage==="S5"),delivery=active.filter(r=>r.stage==="S6");
 const stageCards=CFG.stages.map(st=>{const arr=active.filter(r=>r.stage===st[0]);let val=0;arr.forEach(r=>val+=stageIdx(st[0])<=4?num(r.opportunityValue):num(r.revenue||r.opportunityValue));return `<div class="stage"><b>${st[0]}</b><strong>${st[1]}</strong><small>${arr.length} registro(s)<br>${money(val)}</small></div>`}).join("");
 const alerts=[];active.forEach(r=>{if(stageIdx(r.stage)<=4&&!r.nextStep)alerts.push(`${r.client||"Conta"} — sem próximo passo.`);if(r.stage==="S6"&&!r.expansionHypothesis)alerts.push(`${r.client||"Cliente"} — sem hipótese de expansão.`)});
 $("#content").innerHTML=`<div class="kpis">${kpi("Pipeline bruto",money(commercial.reduce((s,r)=>s+num(r.opportunityValue),0)),commercial.length+" oportunidades")}${kpi("Pipeline ponderado",money(commercial.reduce((s,r)=>s+weighted(r),0)),"Valor x probabilidade")}${kpi("Backlog contratado",money(backlog.reduce((s,r)=>s+num(r.revenue||r.opportunityValue),0)),backlog.length+" registro(s)")}${kpi("Contribuição Delivery",money(delivery.reduce((s,r)=>s+contrib(r),0)),delivery.length+" projeto(s)")}</div>
 <div class="panel"><div class="section-head"><div><h3>Esteira H!</h3><div class="sub">Um registro acompanha toda a jornada comercial e de delivery.</div></div></div><div class="stages">${stageCards}</div></div>
 <div class="grid2"><div class="panel"><h3>Delivery</h3><div class="sub">Projetos em S6.</div>${delivery.length?delivery.map(r=>`<div class="card"><h4>${r.client||"Cliente"} — ${r.opportunity||"Projeto"}</h4><p>Project Lead: ${r.projectLead||"—"} • Execução: ${num(r.progress)}% • Contribuição: <strong>${money(contrib(r))}</strong></p><div class="progress"><span style="width:${Math.max(0,Math.min(100,num(r.progress)))}%"></span></div></div>`).join(""):'<div class="empty">Nenhum projeto em S6.</div>'}</div><div class="panel"><h3>Alertas</h3><div class="sub">Itens para a próxima reunião.</div>${alerts.length?alerts.map(a=>`<div class="alert">${a}</div>`).join(""):'<div class="empty">Nenhum alerta.</div>'}</div></div>`;
}
function journeyView(){
 const sf=$("#sf")?.value||"",stf=$("#stf")?.value||"",q=($("#q")?.value||"").toLowerCase();
 const rows=state.records.filter(r=>(!sf||r.stage===sf)&&(!stf||r.status===stf)&&(!q||[r.client,r.opportunity,r.owner,r.sponsor].some(v=>(v||"").toLowerCase().includes(q))));
 $("#content").innerHTML=`<div class="panel"><div class="section-head"><div><h3>Jornada única</h3><div class="sub">${rows.length} registro(s)</div></div><button id="addRec" class="btn primary">+ Nova oportunidade</button></div>
 <div class="filters"><select id="sf"><option value="">Todas as etapas</option>${CFG.stages.map(s=>`<option value="${s[0]}" ${sf===s[0]?"selected":""}>${s[0]} • ${s[1]}</option>`).join("")}</select><select id="stf"><option value="">Todos os status</option>${CFG.statuses.map(s=>`<option ${stf===s?"selected":""}>${s}</option>`).join("")}</select><input id="q" value="${q}" placeholder="Buscar cliente, projeto, owner..."></div>
 <div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Oportunidade / Projeto</th><th>Etapa</th><th>Status</th><th>Valor</th><th>Owner</th><th>Sponsor</th><th>Próximo passo</th><th>Data</th><th>Ações</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${r.client||"—"}</td><td>${r.opportunity||"—"}</td><td>${stageLabel(r.stage)}</td><td>${badge(r.status||"Ativa")}</td><td>${money(stageIdx(r.stage)<=4?r.opportunityValue:(r.revenue||r.opportunityValue))}</td><td>${r.owner||"—"}</td><td>${r.sponsor||"—"}</td><td>${r.nextStep||"—"}</td><td>${dateBR(r.nextStepDate)}</td><td><div class="actions"><button class="mini edit" data-id="${r.id}">Abrir</button><button class="mini danger del" data-id="${r.id}">Excluir</button></div></td></tr>`).join(""):'<tr><td colspan="10" class="empty">Nenhum registro.</td></tr>'}</tbody></table></div></div>`;
 $("#addRec").onclick=()=>openRecord();$("#sf").onchange=journeyView;$("#stf").onchange=journeyView;$("#q").oninput=journeyView;document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>openRecord(b.dataset.id));document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{if(confirm("Excluir registro?")){state.records=state.records.filter(r=>r.id!==b.dataset.id);save();journeyView()}});
}
function cashView(){
 let acc=0;const cards=state.cash.map(r=>{const g=num(r.actualRevenue)-num(r.consultantCost)-num(r.taxes)-num(r.fixedCosts)-num(r.withdrawals)+num(r.other);acc+=g;return `<div class="cashcard"><h4>${r.month||"Período"}</h4><dl><dt>Receita prevista</dt><dd>${money(r.forecastRevenue)}</dd><dt>Receita realizada</dt><dd>${money(r.actualRevenue)}</dd><dt>Consultores</dt><dd>${money(r.consultantCost)}</dd><dt>Impostos</dt><dd>${money(r.taxes)}</dd><dt>Custos fixos</dt><dd>${money(r.fixedCosts)}</dd><dt>Retiradas</dt><dd>${money(r.withdrawals)}</dd><dt>Outros</dt><dd>${money(r.other)}</dd><dt>Caixa gerado</dt><dd>${money(g)}</dd><dt>Acumulado</dt><dd>${money(acc)}</dd></dl><div class="actions" style="margin-top:10px"><button class="mini cedit" data-id="${r.id}">Editar</button><button class="mini danger cdel" data-id="${r.id}">Excluir</button></div></div>`}).join("");
 $("#content").innerHTML=`<div class="panel"><div class="section-head"><div><h3>Planejamento de Caixa</h3><div class="sub">Todos os campos são livres.</div></div><button id="addCash" class="btn primary">+ Novo período</button></div><div class="cashgrid">${cards||'<div class="empty">Nenhum período.</div>'}</div></div>`;
 $("#addCash").onclick=()=>openCash();document.querySelectorAll(".cedit").forEach(b=>b.onclick=()=>openCash(b.dataset.id));document.querySelectorAll(".cdel").forEach(b=>b.onclick=()=>{if(confirm("Excluir período?")){state.cash=state.cash.filter(r=>r.id!==b.dataset.id);save();cashView()}});
}
function mstep(n,t,p){return `<div class="mstep"><div class="mnum">${n}</div><div><h4>${t}</h4><p>${p}</p></div></div>`}
function meetingView(){
 const a=state.records.filter(r=>["Ativa","Em espera"].includes(r.status||"Ativa"));
 $("#content").innerHTML=`<div class="grid2"><div class="panel"><div class="section-head"><div><h3>Agenda Executiva</h3><div class="sub">Roteiro padrão.</div></div><button id="addAction" class="btn primary">+ Ação</button></div><div class="meeting">${mstep(1,"Caixa e recebimentos",state.cash.length+" período(s) cadastrados.")}${mstep(2,"Pipeline comercial",a.filter(r=>stageIdx(r.stage)<=4).length+" oportunidade(s).")}${mstep(3,"Commit / fechamentos",a.filter(r=>r.stage==="S4").length+" em S4.")}${mstep(4,"Backlog",a.filter(r=>r.stage==="S5").length+" em S5.")}${mstep(5,"Delivery",a.filter(r=>r.stage==="S6").length+" em S6.")}${mstep(6,"Economics e margem","Revisar contribuição, custos e impostos.")}${mstep(7,"Capacidade / pessoas","Revisar Project Leads e especialistas.")}${mstep(8,"Expansão",a.filter(r=>r.stage==="S7").length+" em S7.")}${mstep(9,"Decisões pendentes",state.actions.filter(x=>(x.status||"").toLowerCase()!=="concluído").length+" em aberto.")}${mstep(10,"Ações da semana","Fechar owner e prazo.")}</div></div><div class="panel"><h3>Action Log</h3><div class="sub">Decisões e compromissos.</div>${state.actions.length?`<div class="tablewrap"><table style="min-width:650px"><thead><tr><th>Data</th><th>Tema</th><th>Responsável</th><th>Prazo</th><th>Status</th><th>Ação</th></tr></thead><tbody>${state.actions.map(x=>`<tr><td>${dateBR(x.date)}</td><td>${x.topic||"—"}</td><td>${x.owner||"—"}</td><td>${dateBR(x.dueDate)}</td><td>${x.status||"—"}</td><td><button class="mini aedit" data-id="${x.id}">Editar</button></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">Nenhuma ação.</div>'}</div></div>`;
 $("#addAction").onclick=()=>openAction();document.querySelectorAll(".aedit").forEach(b=>b.onclick=()=>openAction(b.dataset.id));
}
function field(nm,lbl,type,val=""){return `<div class="field"><label>${lbl}</label><input name="${nm}" type="${type}" value="${String(val||"").replaceAll('"','&quot;')}" ${type==="number"?'step="any"':''}></div>`}
function area(nm,lbl,val=""){return `<div class="field full"><label>${lbl}</label><textarea name="${nm}">${val||""}</textarea></div>`}
function select(nm,lbl,opts,val=""){return `<div class="field"><label>${lbl}</label><select name="${nm}"><option value="">Selecione...</option>${opts.map(o=>`<option value="${o[0]}" ${o[0]===val?"selected":""}>${o[1]}</option>`).join("")}</select></div>`}
function journeyLine(stage){const i=stageIdx(stage||"S0");return `<div class="journey">${CFG.stages.map((s,j)=>`<span class="jpill ${j<i?"done":j===i?"current":""}">${s[0]} ${s[1]}</span>${j<7?"›":""}`).join("")}</div>`}
function section(min,title,desc,fields,i){return i>=min?`<section class="form-section"><h3>${title}</h3><p>${desc}</p><div class="form-grid">${fields.join("")}</div></section>`:""}
function recordForm(r){
 const i=stageIdx(r.stage||"S0");
 return `<div class="panel" style="box-shadow:none;background:#f7faf8"><b style="color:var(--green)">Jornada atual</b>${journeyLine(r.stage||"S0")}<div class="sub">Ao avançar a etapa, novos campos aparecem. Os anteriores permanecem salvos.</div></div>
 <section class="form-section"><h3>Dados principais</h3><p>Acompanham o registro durante toda a jornada.</p><div class="form-grid">${field("client","Cliente / Conta","text",r.client)}${field("opportunity","Oportunidade / Projeto","text",r.opportunity)}${select("stage","Etapa atual",CFG.stages,r.stage||"S0")}${select("status","Status",CFG.statuses.map(x=>[x,x]),r.status||"Ativa")}${field("owner","Account Owner","text",r.owner)}${field("sponsor","Sponsor / Influenciador","text",r.sponsor)}${field("nextStep","Próximo passo","text",r.nextStep)}${field("nextStepDate","Data próximo passo","date",r.nextStepDate)}${area("generalNotes","Observações gerais",r.generalNotes)}</div></section>
 ${section(0,"S0 | Radar & Relacionamento","Hipótese inicial.",[area("painHypothesis","Hipótese de dor / agenda executiva",r.painHypothesis),field("source","Origem / indicação / advisor","text",r.source)],i)}
 ${section(1,"S1 | Oportunidade Qualificada","Sponsor, dor, timing e fit.",[area("qualifiedPain","Dor confirmada",r.qualifiedPain),field("urgency","Urgência / timing","text",r.urgency),field("buyingCapacity","Capacidade / processo de contratação","text",r.buyingCapacity),area("qualificationNotes","Qualificação / Go-No-Go",r.qualificationNotes)],i)}
 ${section(2,"S2 | Discovery & Solução","Problema, valor e abordagem.",[area("problemDefinition","Problema / contexto",r.problemDefinition),area("expectedValue","Resultado esperado / valor",r.expectedValue),area("solutionHypothesis","Hipótese de solução H!",r.solutionHypothesis),field("decisionProcess","Decisores / processo decisório","text",r.decisionProcess)],i)}
 ${section(3,"S3 | Proposta","Escopo e economics.",[field("opportunityValue","Valor da proposta","number",r.opportunityValue),field("probability","Probabilidade (%)","number",r.probability),field("closeForecast","Previsão de fechamento","date",r.closeForecast),area("scope","Escopo / entregáveis",r.scope),field("expectedMargin","Margem prevista (%)","number",r.expectedMargin)],i)}
 ${section(4,"S4 | Commit","Negociação final.",[field("negotiationStatus","Status da negociação","text",r.negotiationStatus),area("legalProcurement","Compras / jurídico / pendências",r.legalProcurement),field("expectedStart","Data provável de início","date",r.expectedStart),area("commercialConditions","Condições / concessões",r.commercialConditions)],i)}
 ${section(5,"S5 | Backlog","Mobilização e handoff.",[field("revenue","Receita contratada","number",r.revenue),field("startDate","Data de início","date",r.startDate),field("endDate","Data de término","date",r.endDate),field("projectLead","Project Lead","text",r.projectLead),area("team","Time / capacidade",r.team),area("billingPlan","Plano de faturamento",r.billingPlan)],i)}
 ${section(6,"S6 | Delivery","Execução e economics.",[field("consultantCost","Custo consultores","number",r.consultantCost),field("taxes","Impostos","number",r.taxes),field("progress","% executado","number",r.progress),area("risksDecisions","Riscos / decisões",r.risksDecisions),field("nextDecision","Próxima decisão","text",r.nextDecision),area("expansionHypothesis","Hipótese de expansão",r.expansionHypothesis)],i)}
 ${section(7,"S7 | Expand","Próxima wave / continuidade.",[area("expansionOpportunity","Próxima oportunidade",r.expansionOpportunity),field("expansionType","Tipo de expansão","text",r.expansionType),field("expansionValue","Valor potencial","number",r.expansionValue),field("expansionApproachDate","Momento de abordagem","date",r.expansionApproachDate),area("expansionPlan","Plano de abordagem",r.expansionPlan)],i)}`;
}
function openRecord(id=null){editing={type:"record",id};const r=id?state.records.find(x=>x.id===id):{stage:"S0",status:"Ativa"};$("#modalTitle").textContent=id?(r.client||"Registro")+" — "+stageLabel(r.stage):"Nova oportunidade";$("#formBody").innerHTML=recordForm(r);$("#modalbg").classList.remove("hidden");bindStage()}
function bindStage(){const s=document.querySelector('[name="stage"]');if(s)s.onchange=()=>{const fd=new FormData($("#form")),p={};for(const [k,v] of fd.entries())p[k]=v;const old=editing.id?state.records.find(x=>x.id===editing.id):{};$("#formBody").innerHTML=recordForm({...old,...p,stage:s.value});bindStage()}}
function openCash(id=null){editing={type:"cash",id};const r=id?state.cash.find(x=>x.id===id):{};$("#modalTitle").textContent=id?"Editar período":"Novo período";$("#formBody").innerHTML=`<section class="form-section"><div class="form-grid">${field("month","Mês / período","month",r.month)}${field("forecastRevenue","Receita prevista","number",r.forecastRevenue)}${field("actualRevenue","Receita realizada","number",r.actualRevenue)}${field("consultantCost","Custo consultores","number",r.consultantCost)}${field("taxes","Impostos","number",r.taxes)}${field("fixedCosts","Custos fixos","number",r.fixedCosts)}${field("withdrawals","Retiradas","number",r.withdrawals)}${field("other","Outros (+/-)","number",r.other)}${area("notes","Observações",r.notes)}</div></section>`;$("#modalbg").classList.remove("hidden")}
function openAction(id=null){editing={type:"action",id};const r=id?state.actions.find(x=>x.id===id):{};$("#modalTitle").textContent=id?"Editar ação":"Nova ação";$("#formBody").innerHTML=`<section class="form-section"><div class="form-grid">${field("date","Data da reunião","date",r.date)}${field("topic","Tema / decisão","text",r.topic)}${field("owner","Responsável","text",r.owner)}${field("dueDate","Prazo","date",r.dueDate)}${field("status","Status","text",r.status)}${area("notes","Notas",r.notes)}</div></section>`;$("#modalbg").classList.remove("hidden")}
function closeModal(){editing={type:null,id:null};$("#modalbg").classList.add("hidden")}
$("#form").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),obj={};for(const [k,v] of fd.entries())obj[k]=v;if(editing.type==="record"){if(editing.id){const i=state.records.findIndex(r=>r.id===editing.id);state.records[i]={...state.records[i],...obj}}else state.records.push({id:uid(),...obj})}else if(editing.type==="cash"){if(editing.id){const i=state.cash.findIndex(r=>r.id===editing.id);state.cash[i]={...state.cash[i],...obj}}else state.cash.push({id:uid(),...obj})}else{if(editing.id){const i=state.actions.findIndex(r=>r.id===editing.id);state.actions[i]={...state.actions[i],...obj}}else state.actions.push({id:uid(),...obj})}save();closeModal();render()};
$("#nav").onclick=e=>{const b=e.target.closest("[data-view]");if(b)setView(b.dataset.view)};
$("#primaryAction").onclick=()=>view==="cash"?openCash():view==="meeting"?openAction():openRecord();
$("#closeBtn").onclick=closeModal;$("#cancelBtn").onclick=closeModal;
$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="H_Cockpit_Backup.json";a.click();URL.revokeObjectURL(a.href)};
$("#importInput").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state={records:[],cash:[],actions:[],...JSON.parse(await f.text())};save();render();alert("Backup importado com sucesso.")}catch(err){alert("Arquivo de backup inválido.")}e.target.value=""};
$("#resetBtn").onclick=()=>{if(confirm("Limpar todos os dados deste navegador?")){state={records:[],cash:[],actions:[]};save();setView("dashboard")}};
setView("dashboard");
</script>
