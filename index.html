<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H! Management Cockpit</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">H!</div>
        <div>
          <strong>Management Cockpit</strong>
          <span>Commercial • Delivery • Growth • Cash</span>
        </div>
      </div>

      <nav id="mainNav" class="nav">
        <button class="nav-item active" data-view="dashboard">Cockpit Executivo</button>
        <button class="nav-item" data-view="pipeline">Pipeline Comercial</button>
        <button class="nav-item" data-view="backlog">Backlog</button>
        <button class="nav-item" data-view="delivery">Delivery</button>
        <button class="nav-item" data-view="recurring">Recorrentes</button>
        <button class="nav-item" data-view="expansion">Expansão</button>
        <button class="nav-item" data-view="cashflow">Caixa</button>
        <button class="nav-item" data-view="meetings">Modo Reunião</button>
      </nav>

      <div class="sidebar-footer">
        <button id="exportBtn" class="secondary full">Exportar backup</button>
        <label class="secondary full file-label">
          Importar backup
          <input id="importInput" type="file" accept=".json,application/json" />
        </label>
        <button id="resetBtn" class="ghost full">Limpar dados</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">H! CONSULTORIA</p>
          <h1 id="viewTitle">Cockpit Executivo</h1>
          <p id="viewSubtitle">Visão integrada da esteira comercial, delivery, crescimento e caixa.</p>
        </div>
        <div class="top-actions">
          <button id="quickAddBtn" class="primary">+ Novo registro</button>
        </div>
      </header>

      <section id="content"></section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <p class="eyebrow">REGISTRO H!</p>
          <h2 id="modalTitle">Novo registro</h2>
        </div>
        <button id="closeModalBtn" class="icon-btn" aria-label="Fechar">×</button>
      </div>
      <form id="recordForm">
        <div id="formFields" class="form-grid"></div>
        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="secondary">Cancelar</button>
          <button type="submit" class="primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
